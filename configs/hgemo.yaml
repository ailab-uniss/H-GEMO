# H-GEMO configuration matching the benchmark protocol in the paper.
#
# Usage:
#   python -m hgemo.cli run --config configs/hgemo.yaml --fold-idx 0 \
#       --override dataset.name=Emotions logging.out_dir=runs/Emotions
seed: 42

dataset:
  kind: prefold
  root: data
  name: Emotions          # ← override per dataset
  split_seed: 42          # fixed inner partition when search seed changes

cross_validation:
  enabled: true
  n_folds: 5

model:
  kind: mlknn
  k: 5
  s: 1.0
  mlknn_backend: auto        # torch if available, else scikit-learn
  mlknn_device: auto         # cuda if available, else cpu

evolution:
  pop_size: 50
  crossover_prob: 0.9
  mutation_prob: 0.5
  max_evals_per_feature: 100
  genotype: hypergraph
  early_stopping:
    enabled: true
    # "paper" uses proxy+q on the nine datasets listed in the manuscript
    # and the proxy-only window rule on all other datasets.
    mode: paper
    window: 10
    rel_tol: 0.002
    patience: 2

objectives:
  names:
    - one_minus_macro_f1
    - one_minus_micro_f1
    - feature_ratio
  hv_ref:
    0: 1.0
    1: 1.0
    2: 1.0

hypergraph:
  construction: multilayer_label
  target_feature_ratio: 0.25
  min_feature_ratio: 0.03
  fl_relevance: mi
  fl_mi_estimator: auto
  ll_similarity: jaccard
  init_edge_prob: auto
  edge_prune_prob: 0.1
  edge_toggle_prob: 0.5
  injection_k: 1
  feature_cluster_edges: auto
  graph_contraction_threshold: 0.70
  fl_topk_labels_per_feature: 8
  fl_topm_ratio: 0.15
  fl_topm_min: 3
  fl_mutual_floor: 3
  mutation_routing_swap: 0.40
  mutation_routing_inject: 0.20

logging:
  out_dir: runs/hgemo

reporting:
  budget_mode: count
  budget_step: 1
  max_feature_ratio: 0.25
